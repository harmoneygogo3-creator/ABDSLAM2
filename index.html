<title>مختبر الروبوتات الحي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#02020c;font-family:'Cairo',sans-serif;color:#fff;overflow:hidden;height:100vh}

  .header{position:fixed;top:0;left:0;right:0;text-align:center;padding:12px;z-index:100;
    background:linear-gradient(to bottom,rgba(5,2,20,0.95),transparent);pointer-events:none}
  .profile{width:110px;height:110px;border-radius:50%;border:3px solid #00f0ff;
    box-shadow:0 0 20px #00f0ff,0 0 40px #ff00aa;object-fit:cover;
    animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{transform:scale(1);box-shadow:0 0 20px #00f0ff,0 0 40px #ff00aa}
    50%{transform:scale(1.05);box-shadow:0 0 35px #00f0ff,0 0 70px #ff00aa}
  }
  .name{margin-top:6px;font-size:1.2rem;font-weight:900;
    background:linear-gradient(90deg,#00f0ff,#ff00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

  #world{position:relative;width:100%;height:100vh;overflow:hidden;cursor:crosshair}
  #bg{position:absolute;width:110%;height:110%;left:-5%;top:-5%;
    background:url('1789072715389.png') center/cover no-repeat;
    transition:transform 0.15s ease-out;will-change:transform;
    filter:brightness(1.08) contrast(1.12) saturate(1.15);
    animation:living 12s ease-in-out infinite alternate}
  @keyframes living{
    0%{filter:brightness(1.05) contrast(1.1) saturate(1.1)}
    100%{filter:brightness(1.18) contrast(1.2) saturate(1.3)}
  }

  canvas{position:absolute;inset:0;z-index:5;pointer-events:none}

  .icon{position:absolute;width:46px;height:46px;border-radius:50%;
    background:rgba(0,0,0,0.7);border:2.5px solid #00f0ff;display:flex;
    align-items:center;justify-content:center;font-size:20px;text-decoration:none;
    color:#fff;box-shadow:0 0 12px #00f0ff;z-index:30;
    animation:iconLife 5s infinite;transition:0.25s}
  .icon:hover{transform:scale(1.5)!important;border-color:#ff00aa;box-shadow:0 0 25px #ff00aa}
  @keyframes iconLife{
    0%,38%{opacity:1;transform:scale(1)}
    45%,55%{opacity:0;transform:scale(0.3)}
    62%,100%{opacity:1;transform:scale(1)}
  }

  .i1{top:26%;left:3%} .i2{top:56%;left:5%} .i3{top:24%;left:19.5%}
  .i4{top:30%;left:35.5%} .i5{top:50%;left:44.5%} .i6{top:28%;left:54.5%}
  .i7{top:50%;left:64.5%} .i8{top:28%;left:74.5%} .i9{top:40%;left:85.5%}
  .i10{top:70%;left:78.5%}

  .hot{position:absolute;border-radius:50%;z-index:20;cursor:pointer;
    transition:box-shadow 0.3s}
  .hot:hover{box-shadow:0 0 40px 18px rgba(0,240,255,0.45)}
  .h1{top:26%;left:4%;width:10%;height:24%} .h2{top:53%;left:6%;width:12%;height:22%}
  .h3{top:26%;left:20.5%;width:10%;height:22%} .h4{top:30%;left:35.5%;width:10%;height:22%}
  .h5{top:48%;left:44.5%;width:10%;height:22%} .h6{top:28%;left:54.5%;width:10%;height:22%}
  .h7{top:48%;left:64.5%;width:10%;height:20%} .h8{top:28%;left:74.5%;width:10%;height:22%}
  .h9{top:38%;left:84.5%;width:10%;height:22%} .h10{top:68%;left:77.5%;width:10%;height:20%}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
    background:rgba(0,0,0,0.92);color:#00f0ff;padding:11px 26px;border-radius:40px;
    border:2px solid #00f0ff;font-weight:bold;opacity:0;transition:0.45s;z-index:200}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>

<div id="world">

  <canvas id="c"></canvas>

<div class="toast" id="toast"></div>

<script>
const bg = document.getElementById('bg');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h, mouseX = 0, mouseY = 0;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// حركة Parallax مستمرة حسب الماوس
document.addEventListener('mousemove', e=>{
  mouseX = e.clientX;
  mouseY = e.clientY;
  const x = (e.clientX / w - 0.5) * 28;
  const y = (e.clientY / h - 0.5) * 18;
  bg.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
});

// نظام الجزيئات الحي (يعمل للأبد)
const particles = [];
class Particle{
  constructor(){this.reset(true)}
  reset(init){
    this.x = Math.random()*w;
    this.y = init ? Math.random()*h : h+20;
    this.size = Math.random()*2.5+1;
    this.speedY = Math.random()*1.1+0.3;
    this.speedX = (Math.random()-0.5)*0.8;
    this.color = Math.random()>0.5 ? '#00f0ff' : '#ff00aa';
    this.life = 1;
  }
  update(){
    this.y -= this.speedY;
    this.x += this.speedX;
    // انجذاب خفيف نحو الماوس
    const dx = mouseX - this.x;
    const dy = mouseY - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < 180){
      this.x += dx * 0.008;
      this.y += dy * 0.008;
    }
    if(this.y < -20) this.reset(false);
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
for(let i=0;i<70;i++) particles.push(new Particle());

// حلقة الحياة المستمرة
function animate(){
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{p.update();p.draw()});
  requestAnimationFrame(animate);
}
animate();

// تفاعل الروبوتات
document.querySelectorAll('.hot').forEach(el=>{
  el.addEventListener('click', ()=>{
    const t = document.getElementById('toast');
    t.innerText = `⚡ ${el.dataset.n} يستجيب ويتحرك...`;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2500);
  });
});
</script>
